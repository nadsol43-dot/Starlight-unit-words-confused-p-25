<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Words Often Confused — Interactive Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --cream:        #f6f1e7;
  --cream-2:      #efe7d4;
  --paper:       #fffdf6;
  --ink:         #1b2a4a;
  --ink-soft:    #42506e;
  --muted:       #7b869c;
  --accent:      #b91c1c;   /* deep editorial red */
  --accent-2:    #1e3a5f;   /* navy */
  --green:       #2f7d52;
  --green-bg:    #e1f0e6;
  --red:         #b91c1c;
  --red-bg:      #f7e2e2;
  --amber:       #b97919;
  --amber-bg:    #fdeecf;
  --shadow:      0 24px 60px -28px rgba(20, 30, 60, 0.45);
  --shadow-soft: 0 10px 30px -16px rgba(20, 30, 60, 0.35);
  --radius:      18px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: 'Source Serif 4', Georgia, serif;
  background:
    radial-gradient(1200px 700px at 12% -10%, #fbf6ea 0%, transparent 60%),
    radial-gradient(1000px 600px at 100% 110%, #ece1c9 0%, transparent 55%),
    var(--cream);
  color: var(--ink);
  min-height: 100vh;
  padding: 32px 18px 80px;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Header ---------- */
.deck-header {
  max-width: 760px;
  margin: 0 auto 28px;
  text-align: center;
}
.deck-header .eyebrow {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 10px;
}
.deck-header h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: clamp(28px, 5vw, 42px);
  margin: 0 0 8px;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.deck-header .sub {
  font-size: 16px;
  color: var(--ink-soft);
  font-style: italic;
  margin: 0;
}

/* ---------- Toolbar ---------- */
.toolbar {
  max-width: 760px;
  margin: 0 auto 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.progress {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  color: var(--ink-soft);
  font-weight: 600;
  background: var(--paper);
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid rgba(27,42,74,0.08);
  box-shadow: var(--shadow-soft);
}
.progress .num { color: var(--accent-2); font-weight: 700; }
.toolbar-buttons { display: flex; gap: 10px; }

button.btn {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid rgba(27,42,74,0.12);
  background: var(--paper);
  color: var(--ink);
  padding: 9px 16px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow-soft);
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
button.btn:hover  { transform: translateY(-1px); box-shadow: 0 14px 28px -14px rgba(20,30,60,0.4); }
button.btn:active { transform: translateY(0); }
button.btn.primary {
  background: var(--accent-2);
  color: #fff;
  border-color: var(--accent-2);
}
button.btn.primary:hover { background: #16314f; }
button.btn svg { width: 14px; height: 14px; }

/* ---------- Card stage ---------- */
.stage {
  perspective: 1800px;
  max-width: 760px;
  margin: 0 auto;
  min-height: 520px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 100%;
  aspect-ratio: 4 / 5;
  max-width: 560px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .8s cubic-bezier(.2,.75,.2,1);
}
.card.flipped { transform: rotateY(180deg); }

.face {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: var(--paper);
  border: 1px solid rgba(27,42,74,0.10);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ---------- Front face ---------- */
.front { padding: 34px 30px 26px; }
.front .badge {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.front .badge::before {
  content: '';
  width: 22px; height: 1px;
  background: var(--muted);
  display: inline-block;
}
.front .sentence {
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: clamp(20px, 3vw, 26px);
  line-height: 1.45;
  color: var(--ink);
  font-weight: 400;
  margin: 0 0 28px;
  flex-grow: 1;
  display: flex;
  align-items: center;
}
.options {
  display: flex;
  gap: 14px;
  margin-bottom: 8px;
}
.opt-btn {
  flex: 1;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 22px;
  font-weight: 700;
  padding: 18px 14px;
  border-radius: 14px;
  border: 2px solid rgba(27,42,74,0.18);
  background: var(--cream-2);
  color: var(--ink);
  cursor: pointer;
  transition: all .18s ease;
  position: relative;
}
.opt-btn:hover {
  border-color: var(--accent-2);
  background: #fff;
  transform: translateY(-2px);
  box-shadow: 0 10px 22px -12px rgba(20,30,60,0.35);
}
.opt-btn.correct {
  border-color: var(--green);
  background: var(--green-bg);
  color: var(--green);
  animation: pop .35s ease;
}
.opt-btn.wrong {
  border-color: var(--red);
  background: var(--red-bg);
  color: var(--red);
  animation: shake .4s ease;
}
.opt-btn:disabled { cursor: default; }
.hint {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  color: var(--muted);
  text-align: center;
  margin-top: 6px;
}
@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.06); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

/* ---------- Back face ---------- */
.back {
  transform: rotateY(180deg);
  padding: 0;
  display: grid;
  grid-template-rows: 1fr auto;
}
.back .photo {
  background-size: cover;
  background-position: center;
  position: relative;
}
.back .photo::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 100%);
}
.back .photo .ribbon {
  position: absolute;
  top: 18px; left: 18px;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  color: #fff;
  background: rgba(185,28,28,0.92);
  padding: 7px 12px;
  border-radius: 999px;
  z-index: 2;
}
.back .photo .correct-word {
  position: absolute;
  bottom: 18px; left: 22px;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(26px, 4vw, 34px);
  color: #fff;
  z-index: 2;
  text-shadow: 0 2px 18px rgba(0,0,0,0.55);
}
.back .info {
  padding: 18px 22px 22px;
  background: var(--paper);
}
.back .sentence-final {
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  margin: 0 0 8px;
}
.back .sentence-final .answer {
  color: var(--green);
  font-weight: 600;
  border-bottom: 2px solid var(--green);
  padding-bottom: 1px;
}
.back .ru {
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 15px;
  color: var(--ink-soft);
  font-style: italic;
  margin: 0 0 10px;
}
.back .ru::before {
  content: 'RU ';
  font-family: 'Inter', sans-serif;
  font-style: normal;
  font-size: 10px;
  letter-spacing: 0.18em;
  font-weight: 700;
  color: var(--amber);
  margin-right: 6px;
  vertical-align: 1px;
}
.back .note {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.5;
  margin: 0 0 14px;
  padding: 10px 12px;
  background: var(--amber-bg);
  border-radius: 10px;
  border-left: 3px solid var(--amber);
}
.back .actions { display: flex; gap: 10px; }
.back .speak-btn {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid rgba(27,42,74,0.15);
  background: var(--cream-2);
  color: var(--ink);
  padding: 9px 14px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .15s ease;
}
.back .speak-btn:hover { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
.back .speak-btn.playing svg { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .5; transform: scale(1.15); }
}
.back .speak-btn svg { width: 14px; height: 14px; }

/* ---------- Nav arrows ---------- */
.nav {
  max-width: 760px;
  margin: 26px auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
}
.nav-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 1px solid rgba(27,42,74,0.15);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-soft);
  transition: all .15s ease;
}
.nav-btn:hover { background: var(--accent-2); color: #fff; border-color: var(--accent-2); transform: translateY(-1px); }
.nav-btn:disabled { opacity: .35; cursor: not-allowed; }
.nav-btn:disabled:hover { background: var(--paper); color: var(--ink); border-color: rgba(27,42,74,0.15); transform: none; }
.nav-dots { display: flex; gap: 8px; }
.nav-dots .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(27,42,74,0.18);
  transition: all .2s ease;
}
.nav-dots .dot.active {
  background: var(--accent);
  transform: scale(1.4);
}
.nav-dots .dot.done { background: var(--green); }

/* ---------- Footer hint ---------- */
.footnote {
  max-width: 760px;
  margin: 28px auto 0;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  line-height: 1.7;
}
.footnote kbd {
  font-family: 'Inter', sans-serif;
  background: var(--paper);
  border: 1px solid rgba(27,42,74,0.18);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 6px;
  font-size: 11px;
  color: var(--ink);
}

@media (max-width: 520px) {
  body { padding: 22px 12px 60px; }
  .front { padding: 26px 22px 22px; }
  .back .info { padding: 16px 18px 18px; }
  .options { gap: 10px; }
  .opt-btn { font-size: 19px; padding: 16px 8px; }
}
</style>
</head>

    <h1>Words Often Confused</h1>
    <p class="sub">Pick the right word — the card flips to reveal the answer, the scene, and the Russian translation.</p>
  </header>

        Shuffle
      </button>
      <button class="btn" id="restartBtn" title="Restart the deck">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Restart
      </button>
    </div>
  </div>

  <div class="stage" id="stage">
    <!-- card injected by JS -->
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" aria-label="Previous card">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="nav-dots" id="navDots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Next card">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <p class="footnote">
    Use <kbd>←</kbd> <kbd>→</kbd> to move between cards · <kbd>1</kbd>/<kbd>2</kbd> to pick a word · <kbd>Space</kbd> to flip back · <kbd>S</kbd> to speak
  </p>

// ---- State ------------------------------------------------------------
let order = CARDS.map((_, i) => i);     // current shuffle order
let pos = 0;                            // index into `order`
let answered = new Array(CARDS.length).fill(false);

const stage     = document.getElementById('stage');
const curNum    = document.getElementById('curNum');
const totNum    = document.getElementById('totNum');
const navDots   = document.getElementById('navDots');
const prevBtn   = document.getElementById('prevBtn');
const nextBtn   = document.getElementById('nextBtn');
const shuffleBtn= document.getElementById('shuffleBtn');
const restartBtn= document.getElementById('restartBtn');

totNum.textContent = CARDS.length;

// ---- Helpers ----------------------------------------------------------
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderCard() {
  const cardIdx = order[pos];
  const c = CARDS[cardIdx];
  const optsHtml = c.options.map((w, i) =>
    `<button class="opt-btn" data-word="${escapeHtml(w)}" data-idx="${i}">${escapeHtml(w)}</button>`
  ).join('');

  stage.innerHTML = `
    <div class="card" id="card">
      <div class="face front">
        <div class="badge">Card ${cardIdx + 1} · choose the correct word</div>
        <p class="sentence">
          ${escapeHtml(c.before)} <span style="display:inline-block;min-width:120px"></span> ${escapeHtml(c.after)}
        </p>
        <div class="options" id="options">${optsHtml}</div>
        <p class="hint">Tap a word to check your answer.</p>
      </div>
      <div class="face back">
        <div class="photo" style="background-image:url('${c.img_data}')">
          <div class="ribbon">Correct answer</div>
          <div class="correct-word">${escapeHtml(c.correct)}</div>
        </div>
        <div class="info">
          <p class="sentence-final">${escapeHtml(c.before)} <span class="answer">${escapeHtml(c.correct)}</span> ${escapeHtml(c.after)}</p>
          <p class="ru">${escapeHtml(c.ru)}</p>
          <p class="note">${escapeHtml(c.note)}</p>
          <div class="actions">
            <button class="speak-btn" id="speakBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              Speak
            </button>
          </div>
        </div>
      </div>
    </div>
  `;

  // wire option buttons
  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', () => handleChoice(btn, c));
  });
  // wire speak
  document.getElementById('speakBtn').addEventListener('click', () => speak(c));

  // if already answered before, show as solved
  if (answered[cardIdx]) {
    const correctBtn = [...document.querySelectorAll('.opt-btn')]
      .find(b => b.dataset.word === c.correct);
    if (correctBtn) {
      correctBtn.classList.add('correct');
      correctBtn.disabled = true;
      const other = document.querySelector('.opt-btn:not(.correct)');
      if (other) other.disabled = true;
      document.getElementById('card').classList.add('flipped');
    }
  }

  updateChrome();
}

function handleChoice(btn, c) {
  if (btn.classList.contains('correct') || btn.classList.contains('wrong')) return;
  const chosen = btn.dataset.word;
  if (chosen === c.correct) {
    btn.classList.add('correct');
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    const cardIdx = order[pos];
    answered[cardIdx] = true;
    setTimeout(() => {
      document.getElementById('card').classList.add('flipped');
      // auto-speak once on success
      setTimeout(() => speak(c), 350);
      updateChrome();
    }, 280);
  } else {
    btn.classList.add('wrong');
    setTimeout(() => btn.classList.remove('wrong'), 500);
  }
}

function speak(c) {
  if (!('speechSynthesis' in window)) return;
  const full = `${c.before} ${c.correct} ${c.after}`.replace(/\s+/g, ' ').trim();
  const u = new SpeechSynthesisUtterance(full);
  u.lang = 'en-GB';
  u.rate = 0.95;
  u.pitch = 1.0;
  const btn = document.getElementById('speakBtn');
  if (btn) btn.classList.add('playing');
  u.onend = () => { if (btn) btn.classList.remove('playing'); };
  u.onerror = () => { if (btn) btn.classList.remove('playing'); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function updateChrome() {
  curNum.textContent = pos + 1;
  prevBtn.disabled = pos === 0;
  nextBtn.disabled = pos === order.length - 1;
  navDots.innerHTML = order.map((ci, i) => {
    const cls = i === pos ? 'dot active' : (answered[ci] ? 'dot done' : 'dot');
    return `<span class="${cls}"></span>`;
  }).join('');
}

function gotoPos(p) {
  pos = Math.max(0, Math.min(order.length - 1, p));
  renderCard();
}

function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  renderCard();
}

function restart() {
  order = CARDS.map((_, i) => i);
  answered = new Array(CARDS.length).fill(false);
  pos = 0;
  renderCard();
}

// ---- Wire global buttons ---------------------------------------------
prevBtn.addEventListener('click', () => gotoPos(pos - 1));
nextBtn.addEventListener('click', () => gotoPos(pos + 1));
shuffleBtn.addEventListener('click', shuffle);
restartBtn.addEventListener('click', restart);

// ---- Keyboard nav ----------------------------------------------------
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft')  gotoPos(pos - 1);
  else if (e.key === 'ArrowRight') gotoPos(pos + 1);
  else if (e.key === ' ') {
    e.preventDefault();
    const card = document.getElementById('card');
    if (card) card.classList.toggle('flipped');
  }
  else if (e.key === '1' || e.key === '2') {
    const idx = parseInt(e.key, 10) - 1;
    const btns = document.querySelectorAll('.opt-btn');
    if (btns[idx]) btns[idx].click();
  }
  else if (e.key === 's' || e.key === 'S') {
    const cardIdx = order[pos];
    speak(CARDS[cardIdx]);
  }
});

// ---- First paint ------------------------------------------------------
renderCard();
</script>
